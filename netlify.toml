[build]
  publish = "."
  functions = "netlify"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/form.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# Clean public links for saved restaurant demos. The static page reads the slug from the query string.
[[redirects]]
  from = "/restaurant/:slug/menu"
  to = "/restaurant-menu.html?slug=:slug"
  status = 200
  force = true

[[redirects]]
  from = "/restaurant/:slug/private"
  to = "/restaurant-private.html?slug=:slug"
  status = 200
  force = true

[[redirects]]
  from = "/restaurant/:slug/gallery"
  to = "/restaurant-gallery.html?slug=:slug"
  status = 200
  force = true

[[redirects]]
  from = "/restaurant/:slug/contact"
  to = "/restaurant-contact.html?slug=:slug"
  status = 200
  force = true

[[redirects]]
  from = "/restaurant/*"
  to = "/restaurant-demo.html?slug=:splat"
  status = 200
  force = true
